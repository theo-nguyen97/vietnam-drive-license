name: Android app

on:
  push:
    branches: [main, "claude/**"]
    # Đẩy tag app-v1.2.0 → build + tạo GitHub Release kèm APK/AAB (bộ lọc paths không áp dụng cho tag)
    tags: ["app-v*"]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (bộ đề & mô phỏng trùng web) + chạy thử toàn bộ app bằng Robolectric
        run: ./gradlew testDebugUnitTest --no-daemon

      # Ảnh chụp từng màn hình do AppSmokeTest tạo — xem nhanh giao diện mà không cần máy thật
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lai-lua-screenshots
          path: mobile/app/build/screenshots/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '/tmp/release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
          fi
          ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lai-lua-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lai-lua-release-apk
          path: mobile/app/build/outputs/apk/release/app-release.apk

      # Gói AAB để tải lên Google Play Console (chỉ hợp lệ khi đã cấu hình secrets ký bản release)
      - uses: actions/upload-artifact@v4
        with:
          name: lai-lua-release-aab
          path: mobile/app/build/outputs/bundle/release/app-release.aab

      # Đẩy lên tag dạng app-v* thì đính kèm APK vào GitHub Release để tải trực tiếp.
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/app/build/outputs/apk/release/app-release.apk
            mobile/app/build/outputs/bundle/release/app-release.aab
            mobile/app/build/outputs/apk/debug/app-debug.apk
