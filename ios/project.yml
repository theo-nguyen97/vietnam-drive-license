# Sinh LaiLua.xcodeproj bằng XcodeGen:  brew install xcodegen && xcodegen generate
name: LaiLua
options:
  bundleIdPrefix: vn.lailua
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  LaiLuaCore:
    path: Packages/LaiLuaCore
targets:
  LaiLua:
    type: application
    platform: iOS
    sources:
      - path: LaiLua
      # Dữ liệu dùng chung với bản Android (câu hỏi JSON + PNG biển báo) — copy nguyên thư mục vào bundle.
      - path: ../mobile/app/src/main/assets
        name: assets
        type: folder
        buildPhase: resources
    dependencies:
      - package: LaiLuaCore
    info:
      path: LaiLua/Info.plist
      properties:
        CFBundleDisplayName: Lái Lụa
        CFBundleName: LaiLua
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UISupportsDocumentBrowser: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.lailua.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  LaiLuaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LaiLuaTests
    dependencies:
      - target: LaiLua
      - package: LaiLuaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.lailua.app.tests
schemes:
  LaiLua:
    build:
      targets:
        LaiLua: all
        LaiLuaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LaiLuaTests
    archive:
      config: Release
